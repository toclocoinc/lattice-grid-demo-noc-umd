name: Refresh the saved copy

on:
  schedule:
    # Nightly, well after the daily outage and routing statistics settle.
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time, so two builds never race to commit the same files.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PeeringDB, RIPEstat, IODA, RIPE Atlas and the pinned release's own
      # geometry pack. No key is needed for any of them.
      - name: Build the snapshot
        run: node tools/build-snapshot.mjs

      # Ten minutes of RIPE RIS Live, for the page to replay when it cannot
      # reach the internet. Every withdrawal in it is a real routing event.
      - name: Record ten minutes of the routing feed
        run: node tools/capture-ris.mjs --seconds 600

      - name: Check the page still works
        run: node tools/verify.mjs

      - name: Commit it, if anything changed
        run: |
          if git diff --quiet -- data; then
            echo "The saved copy is unchanged."
            exit 0
          fi
          git config user.name 'noc-refresh[bot]'
          git config user.email 'noc-refresh[bot]@users.noreply.github.com'
          git add data
          git commit -m "Refresh the saved copy and the recorded routing feed"
          git push
